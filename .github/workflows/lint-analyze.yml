name: Lint, Format & Analyze

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Update to match your project version
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Lint Code
        run: flutter analyze
        continue-on-error: true

      - name: Format Check
        run: dart format --set-exit-if-changed lib test
        continue-on-error: true

      - name: Dart Code Metrics
        run: |
          dart pub global activate dart_code_metrics
          metrics analyze lib --no-fatal-warnings || true
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Check for vulnerable dependencies
        run: dart pub outdated --mode=null-safety || true
        continue-on-error: true

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: Check .gitignore
        run: |
          if grep -q "\.env\." .gitignore; then
            echo "✓ Environment files are properly ignored"
          else
            echo "⚠ Warning: .env files might not be properly ignored"
          fi
        continue-on-error: true
